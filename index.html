<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Theme & Login Task</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1 id="themeName">Blue</h1>
  </div>

  <!-- Navbar -->
  <div class="navbar">
    <a href="#" data-theme="blue">Blue</a> | 
    <a href="#" data-theme="green">Green</a> | 
    <a href="#" data-theme="yellow">Yellow</a>
  </div>

  <!-- Login Form Area -->
  <div class="form-area">
    <div class="row">
      <label for="username">Login :</label>
      <input type="text" id="username" placeholder="Enter login">
    </div>

    <div class="row">
      <label for="password">Password :</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <div class="row action">
      <span id="errorMsg"></span>
      <button id="loginBtn">Login</button>
    </div>
  </div>

  <!-- Result Box -->
  <div id="resultBox" class="result-box">
    Blue
  </div>

  <script src="script.js"></script>
</body>
</html>
