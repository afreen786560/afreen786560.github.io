<!DOCTYPE html>

<head>

  <title>Afreen Zafar - Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    /* Aesthetic Title */
    .main-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #2c3e50;
      text-transform: uppercase;
      margin-bottom: 12px;
      border-bottom: 2px solid #eef2f3;
      padding-bottom: 10px;
    }

    /* Intro Paragraph */
    .intro-text {
      font-size: 16px;
      color: #555555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Quote Styling */
    .quote {
      font-style: italic;
      font-size: 14px;
      color: #4a6572;
      background: #f7f9fa;
      padding: 12px 20px;
      border-left: 4px solid #34495e;
      border-radius: 4px;
      margin-bottom: 30px;
    }

    /* Semester Work Section */
    .section-title {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .task-list {
      list-style: none;
    }

    .task-list li {
      margin-bottom: 12px;
    }

    .task-list a {
      display: block;
      padding: 14px 20px;
      background-color: #34495e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .task-list a:hover {
      background-color: #1abc9c;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3);
    }
  </style>
</head>
