
<!DOCTYPE html>
<html>
<head>
    <title>Explore Iran</title>

    <style>
        body {
            background-color: #F5F0FF;
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        .header {
            background-color: #176B45;
            color: white;
            padding: 25px;
            font-size: 32px;
        }

        .heading {
            background-color: #D8E8D5;
            color: #14532D;
            padding: 15px;
            margin: 25px 40px;
            border-radius: 10px;
        }

        .iran-picture {
            width: 500px;
            max-width: 90%;
            height: auto;
            border: 4px solid #176B45;
            border-radius: 12px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            margin: 20px 40px;
        }

        ul {
            display: inline-block;
            text-align: left;
            font-size: 18px;
            line-height: 2;
        }

        .links {
            background-color: #176B45;
            padding: 20px;
            margin-top: 30px;
        }

        .links a {
            color: white;
            background-color: #B8860B;
            padding: 12px 18px;
            margin: 8px;
            border-radius: 6px;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            background-color: #F5F0FF;
            color: #176B45;
        }

        footer {
            background-color: #D8E8D5;
            color: #14532D;
            padding: 15px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="header">
        EXPLORE IRAN
    </div>

    <h1 class="heading">Welcome to Iran</h1>

    <img class="iran-picture"
         src="images/iran-map.jpg"
         alt="Map of Iran">

    

    <p>
        Iran is a country located in Western Asia.
        Its capital city is Tehran.
        Iran is famous for its ancient history,
        Persian culture, beautiful architecture
        and historical monuments.
    </p>


</body>
</html>
