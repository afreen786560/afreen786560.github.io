<!DOCTYPE html>
<html>
<head>
    <title>World Map</title>
</head>

<body bgcolor="#F0F5F9">

    <table width="100%" bgcolor="#123456" cellpadding="25">
        <tr>
            <td align="center">
                <font color="white" size="7">
                    <b>Welcome to the World Map</b>
                </font>
            </td>
        </tr>
    </table>

    <br>

    <center>
        <font color="#123456" size="5">
            <b>Click on Asia to Explore Countries</b>
        </font>

        <br><br>

        <img src="images/world-map.jpg"
             alt="World Map"
             width="1000"
             usemap="#worldmap">

        <map name="worldmap">

            <area shape="rect"
                  coords="550,50,950,400"
                  href="asia.html"
                  alt="Asia"
                  title="Click to Explore Asia">

        </map>

    </center>

</body>
</html>
