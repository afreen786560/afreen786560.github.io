<!DOCTYPE html>
<html>

<head>

    <title>Registration Page</title>

</head>

<body>

<table border="1" width="100%" cellpadding="15">

    <!-- Header -->

    <tr>
        <td align="center">

            <h1>Registration Form</h1>

        </td>
    </tr>


    <!-- Body -->

    <tr>
        <td>

            <form action="third.html">

                <table align="center" cellpadding="10">

                    <tr>

                        <td>Enter Your Name</td>

                        <td>:</td>

                        <td>
                            <input type="text" name="name">
                        </td>

                    </tr>


                    <tr>

                        <td>Enter Your Password</td>

                        <td>:</td>

                        <td>
                            <input type="password" name="password">
                        </td>

                    </tr>


                    <tr>

                        <td>Re-enter Your Password</td>

                        <td>:</td>

                        <td>
                            <input type="password" name="repassword">
                        </td>

                    </tr>


                    <tr>

                        <td>Gender</td>

                        <td>:</td>

                        <td>

                            <input type="radio" name="gender" value="male">

                            Male

                        </td>

                    </tr>


                    <tr>

                        <td></td>

                        <td></td>

                        <td>

                            <input type="radio" name="gender" value="female">

                            Female

                        </td>

                    </tr>


                    <tr>

                        <td>Country</td>

                        <td>:</td>

                        <td>

                            <select name="country">

                                <option>Pakistan</option>

                                <option>India</option>

                                <option>China</option>

                            </select>

                        </td>

                    </tr>


                    <tr>

                        <td>Licence</td>

                        <td>:</td>

                        <td>

                            <textarea rows="5" cols="30">I agree to follow all the terms and conditions of the licence.</textarea>

                        </td>

                    </tr>


                    <tr>

                        <td colspan="3">

                            <input type="checkbox" name="agree">

                            I am agree with licence

                        </td>

                    </tr>


                    <tr>

                        <td colspan="3" align="center">

                            <input type="submit" value="Register">

                        </td>

                    </tr>

                </table>

            </form>

        </td>
    </tr>


    <!-- Footer -->

    <tr>
        <td align="center">

            <p>Web Technology</p>

        </td>
    </tr>

</table>

</body>

</html>
