<!DOCTYPE html>
<html>

<head>

    <title>Login Page</title>

</head>

<body>

<table border="1" width="100%" cellpadding="15">

    <!-- Header -->

    <tr>
        <td align="center">

            <h1>Login Form</h1>

        </td>
    </tr>


    <!-- Body -->

    <tr>
        <td>

            <form action="second.html">

                <table align="center" cellpadding="10">

                    <tr>

                        <td>Username</td>

                        <td>:</td>

                        <td>
                            <input type="text" name="username">
                        </td>

                    </tr>


                    <tr>

                        <td>Password</td>

                        <td>:</td>

                        <td>
                            <input type="password" name="password">
                        </td>

                    </tr>


                    <tr>

                        <td colspan="3" align="center">

                            <input type="submit" value="Login">

                        </td>

                    </tr>

                </table>

            </form>

        </td>
    </tr>


    <!-- Footer -->

    <tr>
        <td align="center">

            <p>Web Technology</p>

        </td>
    </tr>

</table>

</body>

</html>
